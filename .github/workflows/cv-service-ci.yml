name: SEEMADRISHTI AI — Computer Vision Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cv_service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cv_service/**'

jobs:
  python-cv-tests:
    name: Python CV Inference & Validation Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CV Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless torch torchvision ultralytics

      - name: Run Plate Validation Unit Tests
        run: python cv_service/tests/test_plate_validation.py

      - name: Run Loitering Engine Unit Tests
        run: python cv_service/tests/test_loitering_engine.py
